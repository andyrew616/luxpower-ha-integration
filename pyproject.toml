[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "luxpower-qualified-read-core"
version = "0.2.0"
description = "Supported read-only product boundary for the qualified LuxPower FC4 core"
readme = "docs/qualified-read-core.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest==9.0.0",
    "pytest-asyncio==1.3.0",
]
ha-test = [
    "homeassistant==2026.2.3",
    "pytest-homeassistant-custom-component==0.13.316",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["luxpower*", "custom_components.lxp_modbus*"]
namespaces = true
