name: Python Tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify qualified package boundary
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir "${RUNNER_TEMP}/luxpower-dist"
          python -m venv "${RUNNER_TEMP}/luxpower-install"
          "${RUNNER_TEMP}/luxpower-install/bin/pip" install --no-deps "${RUNNER_TEMP}"/luxpower-dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/luxpower-install/bin/python" -c "import sys; from luxpower.qualified import QualifiedLuxReadClient; assert 'custom_components.lxp_modbus.classes.read_client' not in sys.modules; assert 'custom_components.lxp_modbus.classes.modbus_client' not in sys.modules; assert not hasattr(QualifiedLuxReadClient, 'async_read_input')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install testing dependencies if the file exists
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi


      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -v
